<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Práctica de conjugación</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ee;--card:#fff;--ink:#222;--mute:#6b6b6b;--acc:#b5451b;--line:#d9d4c7;--ok:#1f7a3d;--okb:#e1f3e6;--no:#b3261e;--nob:#fbe4e2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b19;--card:#2a2825;--ink:#eee;--mute:#a9a59b;--acc:#e07a4f;--line:#46433d;--ok:#6fd08c;--okb:#1f3a29;--no:#ff8a80;--nob:#442321}}
:root[data-theme="dark"]{--bg:#1c1b19;--card:#2a2825;--ink:#eee;--mute:#a9a59b;--acc:#e07a4f;--line:#46433d;--ok:#6fd08c;--okb:#1f3a29;--no:#ff8a80;--nob:#442321}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 Georgia,'Times New Roman',serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0 .6em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.panel h3{margin:0 0 6px;font-size:1rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
label.o{display:block;margin:7px 0;cursor:pointer}
label.o small{color:var(--mute)}
button{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
button.s{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:.95rem;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;background:var(--acc);color:#fff;border-radius:99px;padding:2px 12px;font-size:.85rem}
.q{font-size:2rem;text-align:center;margin:22px 0 4px;min-height:2.6em;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.35em}
.hint{text-align:center;color:var(--mute);margin-bottom:14px}
.blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.15rem;padding:14px 8px;text-align:left}
.opts button b{color:var(--mute);margin-right:8px}
.opts button.ok{border-color:var(--ok);background:var(--okb)}
.opts button.no{border-color:var(--no);background:var(--nob)}
input.t{width:100%;box-sizing:border-box;font:inherit;font-size:1.4rem;padding:10px;text-align:center;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.sp{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.sp button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:6px 12px}
.fb{margin:14px 0;padding:12px;border-radius:8px;text-align:center;font-size:1.15rem}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.no{background:var(--nob);color:var(--no)}
.row{display:flex;gap:10px;justify-content:center;margin-top:10px}
.hide{display:none}
.stage{border-radius:14px;padding:18px 14px;margin-top:12px;color:#1a1a1a;transition:background .2s}
.stage .hint{color:#444}
.ul{display:inline-block;min-width:3.5em;border-bottom:3px solid #1a1a1a;text-align:center;line-height:1.1;color:#1f6b36}
.tb{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.tr{display:inline-flex;align-items:center;gap:6px}
.bx{display:inline-block;min-width:6em;min-height:1.5em;border:2.5px solid #1a1a1a;border-radius:8px;background:rgba(255,255,255,.65);text-align:center;padding:2px 10px;font-size:1.5rem;color:#1f6b36}
.ar{color:#b5451b;font-weight:bold;font-size:1.6rem;line-height:1}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw label{position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:.8rem;color:var(--mute)}
.sw input{position:absolute;opacity:0}
.sw i{display:block;width:48px;height:32px;border-radius:8px;border:2px solid var(--line);margin-bottom:2px}
.sw input:checked+i{border:3px solid var(--acc)}
.pv{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0;background:#f1e3d6;color:#1a1a1a}
.pv .bx{min-width:3em;font-size:1rem}
.pv .ar{font-size:1.1rem}
select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px}
@media(max-width:420px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Práctica de conjugación</h1>

<div id="setup">
<div class="panel"><h3>Verbos</h3>
<label class="o"><input type="checkbox" class="g" value="ar" checked> Regulares -AR <small>(hablar, caminar…)</small></label>
<label class="o"><input type="checkbox" class="g" value="er" checked> Regulares -ER <small>(comer, beber…)</small></label>
<label class="o"><input type="checkbox" class="g" value="ir" checked> Regulares -IR <small>(vivir, escribir…)</small></label>
<label class="o"><input type="checkbox" class="g" value="stem"> Cambio de raíz <small>(poder, querer, pedir…)</small></label>
<label class="o"><input type="checkbox" class="g" value="yo"> Irregulares en "yo" <small>(hacer, salir, saber…)</small></label>
<label class="o"><input type="checkbox" class="g" value="irr"> Muy irregulares <small>(ser, estar, ir, tener…)</small></label>
</div>
<div class="panel"><h3>Actividad</h3>
<label class="o"><input type="radio" name="act" value="both" checked> Ambas <small>(mezcladas)</small></label>
<label class="o"><input type="radio" name="act" value="r"> En el río <small>(pronombre + verbo ➜ conjugar)</small></label>
<label class="o"><input type="radio" name="act" value="t"> Partido de tenis <small>(responder al otro jugador)</small></label>
</div>
<div class="panel"><h3>Modo</h3>
<label class="o"><input type="radio" name="mode" value="mc" checked> Opción múltiple</label>
<label class="o"><input type="radio" name="mode" value="fill"> Escribir la respuesta</label>
<label class="o" id="tildeO"><input type="checkbox" id="tilde"> Aceptar respuestas sin tildes <small>(solo al escribir)</small></label>
</div>
<div class="panel"><h3>Oraciones</h3>
<label class="o"><input type="checkbox" id="sent"> Oraciones cortas <small>(en vez de solo pronombre + verbo)</small></label>
<label class="o">Traducción al inglés: <select id="tr"><option value="0">No mostrar</option><option value="after">Después de responder</option><option value="always">Siempre visible</option></select> <small>(requiere oraciones)</small></label>
</div>
<div class="panel"><h3>Colores de fondo</h3>
<div>En el río</div><div class="sw" id="swr"></div>
<div style="margin-top:10px">Partido de tenis</div><div class="sw" id="swt"></div>
</div>
<div class="panel"><h3>Flechas del partido de tenis</h3><div id="arrs"></div></div>
<div class="row"><button id="start">Empezar</button></div>
</div>

<div id="game" class="hide">
<div class="bar"><span class="tag" id="tag"></span><span id="stats"></span><button class="s" id="quit">Salir</button></div>
<div id="stage" class="stage"><div class="q" id="q"></div>
<div class="hint" id="hint"></div>
<div class="hint" id="tren" style="font-style:italic"></div>
<div id="ans"></div>
<div id="fb"></div>
<div class="row"><button id="nx" class="hide">Siguiente ➜</button></div></div>
</div>
</div>
<script>
const W=s=>s.split(' ');
const REG={ar:W('hablar caminar bailar cantar estudiar trabajar escuchar comprar nadar necesitar mirar cocinar'),er:W('comer beber correr leer aprender vender comprender creer responder'),ir:W('vivir escribir abrir compartir decidir recibir subir')};
const STEM={'o>ue':W('poder dormir volver encontrar almorzar'),'e>ie':W('querer pensar empezar preferir entender'),'e>i':W('pedir servir repetir')};
const YO={hacer:'hago',poner:'pongo',salir:'salgo',traer:'traigo',conocer:'conozco',saber:'sé',ver:'veo'};
const IRR={ser:W('soy eres es somos son'),estar:W('estoy estás está estamos están'),ir:W('voy vas va vamos van'),tener:W('tengo tienes tiene tenemos tienen'),venir:W('vengo vienes viene venimos vienen'),dar:W('doy das da damos dan'),decir:W('digo dices dice decimos dicen')};
const END={ar:W('o as a amos an'),er:W('o es e emos en'),ir:W('o es e imos en')};
const P=[['yo',0],['tú',1],['él',2],['ella',2],['nosotros',3],['ustedes',4],['ellos',4],['ellas',4]];
const PN=P.map(p=>p[0]),IDX=Object.fromEntries(P);
const PART={yo:'tú','tú':'yo',nosotros:'ustedes',ustedes:'nosotros'};
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function conj(v,i){
 if(v.full)return v.full[i];
 if(i==0&&v.yo)return v.yo;
 let st=v.inf.slice(0,-2);
 if(v.ch&&i!=3){const p=st.lastIndexOf(v.ch[0]);st=st.slice(0,p)+v.ch[1]+st.slice(p+1)}
 return st+END[v.inf.slice(-2)][i];
}
function pool(){
 const o=[];
 [...document.querySelectorAll('.g:checked')].map(x=>x.value).forEach(g=>{
  if(g in REG)REG[g].forEach(inf=>o.push({inf}));
  if(g=='stem')for(const k in STEM)STEM[k].forEach(inf=>o.push({inf,ch:k.split('>')}));
  if(g=='yo')for(const inf in YO)o.push({inf,yo:YO[inf]});
  if(g=='irr')for(const inf in IRR)o.push({inf,full:IRR[inf]});
 });
 return o;
}
const SD={};`hablar|español en clase|speak|Spanish in class
caminar|al parque|walk|to the park
bailar|en la fiesta|dance|at the party
cantar|una canción|sing|a song
estudiar|para el examen|study|for the exam
trabajar|en la tienda|work|at the store
escuchar|música|listen to|music
comprar|pan|buy|bread
nadar|en el río|swim|in the river
necesitar|ayuda|need|help
mirar|la televisión|watch|TV
cocinar|la cena|cook|dinner
comer|pizza|eat|pizza
beber|agua|drink|water
correr|en el parque|run|in the park
leer|un libro|read|a book
aprender|español|learn|Spanish
vender|libros|sell|books
comprender|la lección|understand|the lesson
creer|en la magia|believe|in magic
responder|la pregunta|answer|the question
vivir|en México|live|in Mexico
escribir|una carta|write|a letter
abrir|la puerta|open|the door
compartir|la comida|share|the food
decidir|qué comer|decide|what to eat
recibir|un regalo|receive|a gift
subir|las escaleras|climb|the stairs
poder|ayudar hoy|can|help today
dormir|ocho horas|sleep|eight hours
volver|a casa|return|home
encontrar|las llaves|find|the keys
almorzar|en la cafetería|eat lunch|in the cafeteria
querer|un café|want|a coffee
pensar|en el viaje|think|about the trip
empezar|la tarea|start|the homework
preferir|el té|prefer|tea
entender|la lección|understand|the lesson
pedir|una pizza|order|a pizza
servir|la comida|serve|the food
repetir|la palabra|repeat|the word
hacer|la tarea|do|the homework
poner|la mesa|set|the table
salir|de casa|leave|home
traer|la mochila|bring|the backpack
conocer|la ciudad|know|the city
saber|la respuesta|know|the answer
ver|una película|watch|a movie
ser|de México|be|from Mexico
estar|en casa|be|at home
ir|a la escuela|go|to school
tener|un perro|have|a dog
venir|a la fiesta|come|to the party
dar|un regalo|give|a gift
decir|la verdad|tell|the truth`.split('\n').forEach(l=>{const a=l.split('|');SD[a[0]]=[a[1],a[2],a[3]]});
const ENP={yo:'I','tú':'you',él:'he',ella:'she',nosotros:'we',ustedes:'you all',ellos:'they',ellas:'they'};
const BE=W('am are is are are');
function enF(v,i){const ws=SD[v.inf][1].split(' '),w=ws[0];let f=w;
 if(w=='be')f=BE[i];else if(i==2&&w!='can')f={have:'has',do:'does',go:'goes'}[w]||(/(s|sh|ch|x|o)$/.test(w)?w+'es':/[^aeiou]y$/.test(w)?w.slice(0,-1)+'ies':w+'s');
 return[f,...ws.slice(1)].join(' ')}
const cap=s=>s[0].toUpperCase()+s.slice(1);
const enS=(v,p)=>cap(`${ENP[p]} ${enF(v,IDX[p])} ${SD[v.inf][2]}`)+'.';
const esS=(v,p,f)=>cap(`${p} ${f} ${SD[v.inf][0]}`)+'.';
function boxH(st,t){const b=`<span class="bx">${t||'&nbsp;'}</span>`;
 if(st=='tb')return `<span class="tb"><span class="ar">↓</span>${b}<span class="ar">↑</span></span>`;
 return `<span class="tr"><span class="ar">→</span>${b}${st=='both'?'<span class="ar">←</span>':''}</span>`}
const S={vs:[],act:'both',mode:'mc',tilde:false,sent:false,tr:'0',rc:'#cfe8f7',tc:'#f5d3bf',arr:'both',ok:0,n:0,streak:0,best:0,last:'',cur:null,done:false};
const norm=s=>{s=s.toLowerCase().trim().replace(/\s+/g,' ');return S.tilde?s.normalize('NFD').replace(/[\u0300-\u036f]/g,''):s};
function wrongForms(v,ansForm){
 const set=new Set();
 for(let i=0;i<5;i++)set.add(conj(v,i));
 if(!v.full)for(let i=0;i<5;i++)set.add(conj({inf:v.inf},i));
 set.delete(ansForm);
 return shuf([...set]);
}
function mkQ(){
 let v;do{v=rnd(S.vs)}while(S.vs.length>1&&v.inf===S.last);S.last=v.inf;
 const type=S.act=='both'?rnd(['r','t']):S.act;
 const sn=S.sent,c=SD[v.inf][0],q={type,hint:'',pro:null,form:'',show:'',fill:'',es:''};
 if(type=='r'){
  const p=rnd(PN);q.form=conj(v,IDX[p]);q.pro=p;q.fill=q.show=q.form;q.hint='Conjugar en el presente';const ul='<span class="ul">&nbsp;&nbsp;&nbsp;</span>';
  q.prompt=sn?`${cap(p)} ${ul} (${v.inf}) ${c}.`:`${p} (${v.inf}) ${ul}`;if(sn){q.es=esS(v,p,q.form);q.en=enS(v,p)}
  q.opts=[q.form,...wrongForms(v,q.form).slice(0,3)].map((t,i)=>({t,ok:i==0}));
 }else{
  const p=rnd(PN),r=PART[p]||p,vo=!!PART[p]&&Math.random()<.5;
  const given=conj(v,IDX[p]);q.form=conj(v,IDX[r]);q.pro=r;
  const g=vo?given:`${p} ${given}`;q.prompt=`<span>${sn?cap(g+' '+c)+'.':g}</span>`+boxH(S.arr,'');
  q.hint=`(${v.inf}) · responder como el otro jugador`;if(sn){q.es=esS(v,r,q.form);q.en=enS(v,p);q.en2=enS(v,r)}
  q.show=vo?q.form:`${r} ${q.form}`;
  const w=wrongForms(v,q.form);
  if(vo)q.opts=[q.form,...w.slice(0,3)].map((t,i)=>({t,ok:i==0}));
  else{
   const op=rnd(PN.filter(x=>x!==r&&x!==p));
   q.opts=[{t:`${r} ${q.form}`,ok:true},{t:`${op} ${q.form}`},{t:`${r} ${w[0]}`},{t:`${r} ${w[1]}`}];
  }
 }
 q.opts=shuf(q.opts);
 return q;
}
function check(s){
 s=norm(s).replace(/[.!]$/,'');const q=S.cur,a=norm(q.form),pr=norm(q.pro);
 return s===a||s===pr+' '+a||(!!q.es&&s===norm(q.es).replace(/[.!]$/,''));
}
function show(){
 const q=S.cur=mkQ();S.done=false;
 $('stage').style.background=q.type=='r'?S.rc:S.tc;
 $('tag').textContent=q.type=='r'?'En el río':'Partido de tenis';
 $('q').innerHTML=q.prompt;$('hint').textContent=q.hint;
 $('tren').textContent=S.sent&&S.tr=='always'?q.en:'';
 $('fb').innerHTML='';$('nx').classList.add('hide');
 if(S.mode=='mc'){
  $('ans').innerHTML='<div class="opts">'+q.opts.map((o,i)=>`<button data-i="${i}"><b>${i+1}</b>${o.t}</button>`).join('')+'</div>';
  $('ans').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 }else{
  $('ans').innerHTML=`<input class="t" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribir aquí"><div class="sp">${['á','é','í','ó','ú','ñ'].map(c=>`<button type="button" data-c="${c}">${c}</button>`).join('')}</div><div class="row"><button id="go">Comprobar</button></div>`;
  $('ans').querySelectorAll('[data-c]').forEach(b=>b.onmousedown=e=>{e.preventDefault();const i=$('inp');i.setRangeText(b.dataset.c,i.selectionStart,i.selectionEnd,'end');i.focus()});
  $('go').onclick=()=>answer($('inp').value);
  $('inp').focus();
 }
 stats();
}
function stats(){$('stats').textContent=`${S.ok}/${S.n} · racha ${S.streak} · mejor ${S.best}`}
function answer(x){
 if(S.done)return;
 const q=S.cur;let ok;
 if(S.mode=='mc'){
  ok=q.opts[x].ok;
  $('ans').querySelectorAll('button').forEach((b,i)=>{b.disabled=true;if(q.opts[i].ok)b.classList.add('ok');else if(i===x)b.classList.add('no')});
 }else{
  if(!String(x).trim())return;
  ok=check(x);$('inp').disabled=true;$('go').classList.add('hide');
 }
 S.done=true;S.n++;
 if(ok){S.ok++;S.streak++;S.best=Math.max(S.best,S.streak)}else S.streak=0;
 const sh=q.es||q.show,ul=document.querySelector('#q .ul'),bx=document.querySelector('#q .bx');
 if(ul)ul.textContent=q.fill;if(bx)bx.textContent=q.show;
 $('fb').innerHTML=ok?`<div class="fb ok">¡Correcto! ${sh}</div>`:`<div class="fb no">Respuesta correcta: <b>${sh}</b></div>`;
 if(S.sent&&S.tr!='0')$('tren').textContent=q.en+(q.en2?' ➜ '+q.en2:'');
 $('nx').classList.remove('hide');$('nx').focus();stats();
}
$('start').onclick=()=>{
 S.vs=pool();if(S.vs.length<3){alert('Seleccionar al menos un grupo de verbos.');return}
 S.act=document.querySelector('[name=act]:checked').value;S.mode=document.querySelector('[name=mode]:checked').value;S.tilde=$('tilde').checked;
 S.sent=$('sent').checked;S.tr=S.sent?$('tr').value:'0';
 ['rc','tc','arr'].forEach(k=>S[k]=document.querySelector(`[name=${k}]:checked`).value);
 S.ok=S.n=S.streak=S.best=0;
 $('setup').classList.add('hide');$('game').classList.remove('hide');show();
};
$('nx').onclick=show;
const sw=(nm,a)=>a.map((c,i)=>`<label><input type="radio" name="${nm}" value="${c[1]}"${i?'':' checked'}><i style="background:${c[1]}"></i>${c[0]}</label>`).join('');
$('swr').innerHTML=sw('rc',[['Azul','#cfe8f7'],['Menta','#d3f0de'],['Arena','#f1e6c8'],['Blanco','#ffffff']]);
$('swt').innerHTML=sw('tc',[['Arcilla','#f5d3bf'],['Lima','#e3f1bd'],['Amarillo','#faeeae'],['Lila','#e4d8f4']]);
$('arrs').innerHTML=[['both','A ambos lados'],['before','Solo antes'],['tb','Arriba y abajo']].map((a,i)=>`<label class="o"><input type="radio" name="arr" value="${a[0]}"${i?'':' checked'}> ${a[1]}<div class="pv"><span>tú hablas</span>${boxH(a[0],'')}</div></label>`).join('');
$('tr').disabled=true;$('sent').onchange=()=>{$('tr').disabled=!$('sent').checked};
$('quit').onclick=()=>{$('game').classList.add('hide');$('setup').classList.remove('hide')};
document.addEventListener('keydown',e=>{
 if($('game').classList.contains('hide'))return;
 if(e.key==='Enter'){if(S.done){e.preventDefault();show()}else if(S.mode=='fill'){e.preventDefault();answer($('inp').value)}}
 else if(S.mode=='mc'&&!S.done&&/^[1-4]$/.test(e.key))answer(+e.key-1);
});
</script>
</body>
</html>
